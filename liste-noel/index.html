<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La liste de Noël d'Alex 🎄</title>
  <meta name="description" content="Un message du Père Noël… et la liste de Noël d'Alex." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎅</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ INTRO : MESSAGE DU PÈRE NOËL ============ -->
  <section id="intro" class="intro" aria-label="Message du Père Noël">
    <video id="santa-video" class="intro__video" playsinline preload="auto">
      <source src="assets/pere-noel.mp4" type="video/mp4" />
    </video>
    <div class="intro__vignette"></div>

    <!-- Écran de lancement (le son nécessite un clic) -->
    <div id="intro-start" class="intro__start">
      <p class="eyebrow">Tu as reçu un message</p>
      <h1 class="intro__title">Le Père Noël<br /><em>a quelque chose à te dire</em></h1>
      <button id="play-btn" class="btn btn--play" type="button">
        <span class="btn__icon" aria-hidden="true">▶</span>
        Écouter le message
      </button>
    </div>

    <!-- Contrôle du son pendant la lecture -->
    <button id="mute-btn" class="intro__mute" type="button" aria-label="Couper le son" hidden>🔊</button>

    <!-- Bouton toujours visible en bas -->
    <div class="intro__bottom">
      <button id="skip-btn" class="btn btn--gold" type="button">
        Accéder directement à la liste
        <span aria-hidden="true">→</span>
      </button>
    </div>
  </section>

  <!-- ============ LA LISTE ============ -->
  <main id="liste" class="liste" aria-label="La liste de Noël d'Alex" hidden>
    <canvas id="snow" class="snow" aria-hidden="true"></canvas>

    <header class="hero">
      <p class="eyebrow">Noël 2026</p>
      <h1 class="hero__title">La liste de Noël <em>d'Alex</em></h1>
      <div class="ornament" aria-hidden="true"><span></span>✦<span></span></div>
      <p class="hero__text">
        Merci d'être passé par ici ! Voici quelques idées qui me feraient plaisir 🎄
      </p>
      <button id="replay-btn" class="btn btn--ghost" type="button">🎅 Revoir le message du Père Noël</button>
    </header>

    <section class="grid" id="grid" aria-live="polite"></section>

    <footer class="footer">
      <p>Fait avec ❤️ par Alex · Joyeux Noël !</p>
    </footer>
  </main>

  <script src="cadeaux.js"></script>
  <script src="script.js"></script>
</body>
</html>
